name: Product installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/local_lmx
      - name: Install engine dependencies
        run: python -m pip install -r requirements.txt pyinstaller uv
      - name: Verify production engine
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build owned native engine and converter
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: cargo build --release --locked --manifest-path integrations/local_lmx/Cargo.toml
      - name: Verify real model conversion and CPU inference
        run: python tests/native-smoke.py
      - name: Bundle independent runtime
        run: python desktop/scripts/package-runtime.py
      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci
      - name: Build and smoke-test UI
        working-directory: desktop
        run: npm run build && node ../tests/installer-smoke.cjs
      - name: Package installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SPARTADY-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/release/*.dmg
            desktop/release/*.exe
          fail_on_unmatched_files: false
          draft: true
